name: Auto Video Bot (Instagram Direct)

on:
  schedule:
    - cron: '0 */6 * * *' # هر ۶ ساعت
  workflow_dispatch:
    inputs:
      bot_status:
        description: 'وضعیت ربات (فعال / متوقف)'
        type: choice
        options: ['فعال', 'متوقف']
        default: 'فعال'
      dry_run:
        description: 'حالت تست (بدون پست کردن در اینستاگرام)'
        type: boolean
        default: false
      parts_per_run:
        description: 'تعداد پست در هر بار اجرا'
        type: choice
        options: ['1', '2', '3', '4']
        default: '2'
      whisper_model:
        description: 'مدل تبدیل صدا به متن (Whisper)'
        type: choice
        options: ['small.en', 'medium.en']
        default: 'small.en'
      video_url:
        description: 'لینک ویدیوی خاص (اختیاری - برای پردازش ویدیوی خارج از صف)'
        type: string
        required: false
      video_index:
        description: 'شماره ویدیو در صف اصلی (اختیاری)'
        type: string
        required: false
      custom_caption:
        description: 'کپشن دلخواه (اختیاری - خالی بگذارید تا هوش مصنوعی بنویسد)'
        type: string
        required: false
      custom_hashtags:
        description: 'هشتگ‌های دلخواه با فاصله (اختیاری)'
        type: string
        required: false

concurrency:
  group: auto-video-bot
  cancel-in-progress: false

jobs:
  process:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    permissions:
      contents: write

    env:
      INSTAGRAM_SESSIONID:   ${{ secrets.INSTAGRAM_SESSIONID }}
      GEMINI_KEY_1:          ${{ secrets.GEMINI_KEY_1 }}
      GEMINI_KEY_2:          ${{ secrets.GEMINI_KEY_2 }}
      GEMINI_KEY_3:          ${{ secrets.GEMINI_KEY_3 }}
      GEMINI_KEY_4:          ${{ secrets.GEMINI_KEY_4 }}
      TELEGRAM_BOT_TOKEN:    ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:      ${{ secrets.TELEGRAM_CHAT_ID }}
      YOUTUBE_CHANNEL_URL:   ${{ secrets.YOUTUBE_CHANNEL_URL }}
      YOUTUBE_COOKIES:       ${{ secrets.YOUTUBE_COOKIES }}
      WARP_PROXY:            socks5://127.0.0.1:40000
      PO_TOKEN_PROVIDER_URL: http://127.0.0.1:4416
      
      BOT_STATUS:            ${{ github.event.inputs.bot_status || 'فعال' }}
      DRY_RUN:               ${{ github.event.inputs.dry_run || 'false' }}
      PARTS_PER_RUN:         ${{ github.event.inputs.parts_per_run || '2' }}
      WHISPER_MODEL:         ${{ github.event.inputs.whisper_model || 'small.en' }}
      CUSTOM_VIDEO_URL:      ${{ github.event.inputs.video_url }}
      VIDEO_INDEX:           ${{ github.event.inputs.video_index }}
      CUSTOM_CAPTION:        ${{ github.event.inputs.custom_caption }}
      CUSTOM_HASHTAGS:       ${{ github.event.inputs.custom_hashtags }}
      
      GITHUB_ACTIONS:        "true"
      HF_HOME:               ${{ github.workspace }}/.hf-cache
      PYTHONUNBUFFERED:      "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore state from 'state' branch
        run: bash scripts/persist-state.sh restore

      - name: Cache HuggingFace (whisper model)
        uses: actions/cache@v4
        with:
          path: .hf-cache
          key: hf-whisper-${{ github.event.inputs.whisper_model || 'small.en' }}-v1

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ hashFiles('requirements.txt') }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install system deps (FFmpeg, Fonts, Deno, Unzip)
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq || true
          sudo apt-get -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y -qq ffmpeg fontconfig curl unzip || true
          curl -fsSL https://deno.land/install.sh | sh
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Install python deps
        run: |
          pip install -U yt-dlp
          pip install -r requirements.txt

      - name: Install Vazir font
        run: |
          mkdir -p ~/.fonts
          wget -q https://github.com/rastikerdar/vazir-font/releases/download/v30.1.0/vazir-font-v30.1.0.zip -O /tmp/vazir.zip
          unzip -q /tmp/vazir.zip -d /tmp/vazir
          find /tmp/vazir -name "*.ttf" -exec cp {} ~/.fonts/ \;
          fc-cache -f ~/.fonts

      - name: Setup WARP proxy (soft-fail)
        continue-on-error: true
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/cloudflare-warp.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-warp.list
          sudo apt-get update -qq || true
          sudo apt-get install -y -qq cloudflare-warp || true
          warp-cli --accept-tos registration new || true
          warp-cli --accept-tos mode proxy || true
          warp-cli --accept-tos proxy port 40000 || true
          warp-cli --accept-tos connect || true
          sleep 5
          curl -s --socks5-hostname 127.0.0.1:40000 -m 8 -o /dev/null https://www.google.com \
            && echo "WARP OK" || echo "WARP failed — will rely on cookies"

      - name: Setup PO-token provider (soft-fail)
        continue-on-error: true
        run: |
          git clone --depth=1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /tmp/pot
          cd /tmp/pot/server
          npm install --no-audit --no-fund
          npx tsc
          nohup node build/main.js > /tmp/pot.log 2>&1 &
          sleep 3
          curl -sf http://127.0.0.1:4416/ping && echo "POT OK" || echo "POT unavailable"

      - name: Run bot
        run: python3 bot.py

      - name: Persist state to 'state' branch
        if: always()
        run: bash scripts/persist-state.sh save

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-logs
          path: |
            /tmp/pot.log
            *.log
          if-no-files-found: ignore